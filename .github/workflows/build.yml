name: Build QMK firmware

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - name: Disable git safe.directory checks
        run: git config --global --add safe.directory '*'

      - name: Checkout userspace
        uses: actions/checkout@v4
        with:
          path: userspace

      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          ref: master
          submodules: recursive
          path: qmk_firmware

      - name: Compile
        run: |
          qmk config user.qmk_home="$GITHUB_WORKSPACE/qmk_firmware"
          qmk config user.overlay_dir="$GITHUB_WORKSPACE/userspace"
          qmk compile -kb ferris/sweep -km mac
          mkdir -p "$GITHUB_WORKSPACE/out"
          find "$GITHUB_WORKSPACE" -name '*.uf2' -not -path '*/.git/*' -exec cp -n {} "$GITHUB_WORKSPACE/out/" \;
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/*.uf2
          if-no-files-found: error
